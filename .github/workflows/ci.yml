name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Connect
        run: npm run build:connect

      - name: Build Admin
        run: npm run build:admin

      - name: Build Nexus
        run: npm run build:nexus

      - name: Build Transport
        run: npm run build:transport
