name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint Connect
        run: npm run lint --workspace=@lumenx/app-connect

      - name: Test Connect
        run: npm run test:connect

      - name: Test Admin
        run: npm run test --workspace=@lumenx/app-admin

      - name: Test Admissions
        run: npm run test --workspace=@lumenx/app-admissions

      - name: Test Careers
        run: npm run test --workspace=@lumenx/app-careers

      - name: Test Nexus
        run: npm run test --workspace=@lumenx/app-nexus

      - name: Test Transport
        run: npm run test --workspace=@lumenx/app-transport

      - name: Test Shared Auth
        run: npm run test --workspace=@lumenx/auth

      - name: Test Backend API
        run: npm run test --workspace=@lumenx/api

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test safe browser auth journeys
        run: npm run test:e2e:safe

      - name: Build Backend API
        run: npm run build:api

      - name: Build Connect
        run: npm run build:connect

      - name: Build Admin
        run: npm run build:admin

      - name: Build Nexus
        run: npm run build:nexus

      - name: Build Transport
        run: npm run build:transport

      - name: Build Admissions
        run: npm run build:admissions

      - name: Build Careers
        run: npm run build:careers

      - name: Build Website
        run: npm run build:website
